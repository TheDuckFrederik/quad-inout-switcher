<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 18px Arial, sans-serif; fill: #374151; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .jack { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; }
      .section { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .control { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .pedal { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .switch { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .signal { fill: none; stroke: #c2410c; stroke-width: 5; marker-end: url(#arrowOrange); }
      .logic { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
      .ground { fill: none; stroke: #111827; stroke-width: 3; stroke-dasharray: 4 5; }
      .ledOn { fill: #22c55e; stroke: #166534; stroke-width: 2; }
      .ledOff { fill: #d1d5db; stroke: #6b7280; stroke-width: 2; }
      .arrowLed { fill: #22c55e; stroke: #166534; stroke-width: 2; }
    </style>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="title">Proposed Architecture — 15-Jack Pedal / Amp Router</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Concept diagram for checking the signal flow; orange = audio, blue dashed = switching/control logic</text>

  <!-- Panel jack arrangement -->
  <rect x="55" y="110" width="1690" height="430" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="80" y="145" class="label">JACK AND LED PANEL</text>

  <!-- INST IN -->
  <rect x="80" y="185" width="180" height="115" rx="12" class="jack"/>
  <circle cx="170" cy="230" r="22" fill="#111827"/>
  <circle cx="170" cy="230" r="9" fill="#f9fafb"/>
  <text x="170" y="275" text-anchor="middle" class="label">INST IN</text>
  <text x="170" y="295" text-anchor="middle" class="tiny">1 × 6.3 mm jack</text>

  <!-- pedal jacks left -->
  <rect x="80" y="350" width="180" height="145" rx="12" class="pedal"/>
  <circle cx="135" cy="400" r="18" fill="#111827"/><circle cx="135" cy="400" r="7" fill="#fff"/>
  <circle cx="205" cy="400" r="18" fill="#111827"/><circle cx="205" cy="400" r="7" fill="#fff"/>
  <text x="170" y="445" text-anchor="middle" class="label">PEDAL SEND / RETURN</text>
  <text x="170" y="466" text-anchor="middle" class="tiny">2 × 6.3 mm jacks</text>
  <text x="135" y="425" text-anchor="middle" class="tiny">SEND</text>
  <text x="205" y="425" text-anchor="middle" class="tiny">RETURN</text>

  <!-- top FX banks -->
  <text x="665" y="178" text-anchor="middle" class="label">FX SEND BANK — TO AMP FX RETURNS</text>
  <text x="1205" y="178" text-anchor="middle" class="label">FX RETURN BANK — FROM AMP FX SENDS</text>
  <g>
    <rect x="430" y="195" width="470" height="135" rx="12" class="section"/>
    <rect x="970" y="195" width="470" height="135" rx="12" class="section"/>
    <!-- send jacks -->
    <g>
      <circle cx="500" cy="245" r="18" fill="#111827"/><circle cx="500" cy="245" r="7" fill="#fff"/>
      <circle cx="620" cy="245" r="18" fill="#111827"/><circle cx="620" cy="245" r="7" fill="#fff"/>
      <circle cx="740" cy="245" r="18" fill="#111827"/><circle cx="740" cy="245" r="7" fill="#fff"/>
      <circle cx="860" cy="245" r="18" fill="#111827"/><circle cx="860" cy="245" r="7" fill="#fff"/>
      <text x="500" y="285" text-anchor="middle" class="label">FX S1</text><text x="620" y="285" text-anchor="middle" class="label">FX S2</text><text x="740" y="285" text-anchor="middle" class="label">FX S3</text><text x="860" y="285" text-anchor="middle" class="label">FX S4</text>
      <circle cx="500" cy="215" r="9" class="ledOff"/><circle cx="620" cy="215" r="9" class="ledOff"/><circle cx="740" cy="215" r="9" class="ledOn"/><circle cx="860" cy="215" r="9" class="ledOff"/>
    </g>
    <!-- return jacks -->
    <g>
      <circle cx="1040" cy="245" r="18" fill="#111827"/><circle cx="1040" cy="245" r="7" fill="#fff"/>
      <circle cx="1160" cy="245" r="18" fill="#111827"/><circle cx="1160" cy="245" r="7" fill="#fff"/>
      <circle cx="1280" cy="245" r="18" fill="#111827"/><circle cx="1280" cy="245" r="7" fill="#fff"/>
      <circle cx="1400" cy="245" r="18" fill="#111827"/><circle cx="1400" cy="245" r="7" fill="#fff"/>
      <text x="1040" y="285" text-anchor="middle" class="label">FX R1</text><text x="1160" y="285" text-anchor="middle" class="label">FX R2</text><text x="1280" y="285" text-anchor="middle" class="label">FX R3</text><text x="1400" y="285" text-anchor="middle" class="label">FX R4</text>
      <circle cx="1040" cy="215" r="9" class="ledOff"/><circle cx="1160" cy="215" r="9" class="ledOff"/><circle cx="1280" cy="215" r="9" class="ledOn"/><circle cx="1400" cy="215" r="9" class="ledOff"/>
    </g>
    <text x="665" y="315" text-anchor="middle" class="tiny">Selected as a linked pair with the output channel</text>
    <text x="1205" y="315" text-anchor="middle" class="tiny">Selected as a linked pair with the output channel</text>
  </g>

  <!-- bottom outputs -->
  <text x="1080" y="370" text-anchor="middle" class="label">AMP / DEVICE OUTPUT BANK</text>
  <rect x="430" y="385" width="1010" height="125" rx="12" class="section"/>
  <g>
    <circle cx="570" cy="430" r="20" fill="#111827"/><circle cx="570" cy="430" r="8" fill="#fff"/>
    <circle cx="810" cy="430" r="20" fill="#111827"/><circle cx="810" cy="430" r="8" fill="#fff"/>
    <circle cx="1050" cy="430" r="20" fill="#111827"/><circle cx="1050" cy="430" r="8" fill="#fff"/>
    <circle cx="1290" cy="430" r="20" fill="#111827"/><circle cx="1290" cy="430" r="8" fill="#fff"/>
    <text x="570" y="475" text-anchor="middle" class="label">OUT 1</text><text x="810" y="475" text-anchor="middle" class="label">OUT 2</text><text x="1050" y="475" text-anchor="middle" class="label">OUT 3</text><text x="1290" y="475" text-anchor="middle" class="label">OUT 4</text>
    <circle cx="570" cy="400" r="10" class="ledOff"/><circle cx="810" cy="400" r="10" class="ledOff"/><circle cx="1050" cy="400" r="10" class="ledOn"/><circle cx="1290" cy="400" r="10" class="ledOff"/>
  </g>
  <text x="1460" y="445" class="tiny">12 channel LEDs total:</text><text x="1460" y="465" class="tiny">4 OUT + 4 FX SEND + 4 FX RETURN</text>

  <!-- signal architecture -->
  <rect x="300" y="590" width="1190" height="300" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="895" y="625" text-anchor="middle" class="label">ANALOG AUDIO ROUTING — ONE ACTIVE CHANNEL AT A TIME</text>

  <rect x="350" y="680" width="190" height="75" rx="10" class="jack"/>
  <text x="445" y="713" text-anchor="middle" class="label">INPUT SELECTOR</text>
  <text x="445" y="736" text-anchor="middle" class="small">Selects OUT / FX pair 1–4</text>

  <rect x="650" y="650" width="220" height="135" rx="10" class="switch"/>
  <text x="760" y="685" text-anchor="middle" class="label">PEDAL POSITION</text>
  <text x="760" y="710" text-anchor="middle" class="small">PRE-AMP or FX LOOP</text>
  <text x="760" y="738" text-anchor="middle" class="tiny">2nd footswitch changes path</text>

  <rect x="980" y="680" width="190" height="75" rx="10" class="jack"/>
  <text x="1075" y="713" text-anchor="middle" class="label">SELECTED ROUTE</text>
  <text x="1075" y="736" text-anchor="middle" class="small">OUT n + FX S/R n</text>

  <path d="M260 242 C300 242 300 715 350 715" class="signal"/>
  <path d="M540 717 L650 717" class="signal"/>
  <path d="M870 717 L980 717" class="signal"/>
  <path d="M1170 717 C1240 717 1240 430 1290 430" class="signal"/>
  <text x="275" y="570" class="small" transform="rotate(-90 275 570)">instrument signal</text>

  <!-- FX loop branch -->
  <path d="M760 650 C760 610 665 575 665 330" class="signal"/>
  <path d="M760 650 C760 610 1205 575 1205 330" class="signal"/>
  <text x="785" y="600" class="small">selected FX S/R pair n</text>

  <!-- pedal branch -->
  <rect x="440" y="945" width="260" height="90" rx="12" class="pedal"/>
  <text x="570" y="980" text-anchor="middle" class="label">EXTERNAL PEDALS</text>
  <text x="570" y="1005" text-anchor="middle" class="small">PEDAL SEND → pedals → PEDAL RETURN</text>
  <path d="M570 945 L570 785" class="signal"/>
  <path d="M650 785 C650 850 630 900 630 945" class="signal"/>

  <!-- footswitches and arrows -->
  <rect x="860" y="945" width="170" height="90" rx="12" class="control"/>
  <text x="945" y="980" text-anchor="middle" class="label">FOOTSWITCH 1</text>
  <text x="945" y="1005" text-anchor="middle" class="small">CHANNEL 1→4</text>
  <path d="M945 945 L945 820" class="logic"/>

  <rect x="1080" y="945" width="190" height="90" rx="12" class="control"/>
  <text x="1175" y="980" text-anchor="middle" class="label">FOOTSWITCH 2</text>
  <text x="1175" y="1005" text-anchor="middle" class="small">PEDAL POSITION</text>
  <path d="M1175 945 C1175 870 820 870 820 785" class="logic"/>

  <!-- arrows indicator -->
  <polygon points="790,1010 835,985 835,1002 875,1002 875,1018 835,1018 835,1035" class="arrowLed"/>
  <text x="790" y="1070" class="tiny">PRE-AMP arrow LED</text>
  <polygon points="1310,1010 1355,985 1355,1002 1395,1002 1395,1018 1355,1018 1355,1035" class="ledOff"/>
  <text x="1305" y="1070" class="tiny">FX LOOP arrow LED</text>

  <!-- ground and legend -->
  <path d="M100 1085 L1500 1085" class="ground"/>
  <text x="100" y="1115" class="label">AUDIO_GND</text>
  <text x="250" y="1115" class="small">All 15 jack sleeves share the audio ground; signal tips remain separate.</text>

  <rect x="1510" y="590" width="230" height="300" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="1625" y="625" text-anchor="middle" class="label">LEGEND</text>
  <line x1="1535" y1="660" x2="1585" y2="660" class="signal"/><text x="1600" y="665" class="small">Audio</text>
  <line x1="1535" y1="700" x2="1585" y2="700" class="logic"/><text x="1600" y="705" class="small">Control</text>
  <circle cx="1555" cy="745" r="9" class="ledOn"/><text x="1580" y="750" class="small">Active LED</text>
  <circle cx="1555" cy="785" r="9" class="ledOff"/><text x="1580" y="790" class="small">Inactive LED</text>
  <text x="1535" y="835" class="tiny">Example shown:</text><text x="1535" y="855" class="tiny">OUT 3 + FX S/R 3</text>

  <text x="900" y="1175" text-anchor="middle" class="tiny">Concept only: confirm whether Footswitch 1 cycles the linked OUT/FX pair and Footswitch 2 moves the external pedals between pre-amp and FX-loop positions.</text>
</svg>
