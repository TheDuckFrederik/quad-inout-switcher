<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 18px Arial, sans-serif; fill: #374151; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .jack { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; }
      .section { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .control { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .loopA { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
      .loopB { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; }
      .switchBox { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .signal { fill: none; stroke: #c2410c; stroke-width: 5; marker-end: url(#arrowOrange); }
      .logic { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
      .ground { fill: none; stroke: #111827; stroke-width: 3; stroke-dasharray: 4 5; }
      .ledOn { fill: #22c55e; stroke: #166534; stroke-width: 2; }
      .ledOff { fill: #d1d5db; stroke: #6b7280; stroke-width: 2; }
    </style>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>

  <rect width="1900" height="1300" fill="#ffffff"/>
  <text x="950" y="46" text-anchor="middle" class="title">Final Architecture — Dual Pedal-Loop Router with Position Switching</text>
  <text x="950" y="74" text-anchor="middle" class="subtitle">Orange = audio path, Blue dashed = footswitch control logic. Confirm before finalizing hardware.</text>

  <!-- Panel -->
  <rect x="55" y="105" width="1790" height="440" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="80" y="138" class="label">JACK AND LED PANEL</text>

  <!-- INSTRUMENT IN (right side) -->
  <rect x="1660" y="180" width="180" height="115" rx="12" class="jack"/>
  <circle cx="1750" cy="225" r="22" fill="#111827"/>
  <circle cx="1750" cy="225" r="9" fill="#f9fafb"/>
  <text x="1750" y="270" text-anchor="middle" class="label">INSTRUMENT IN</text>
  <text x="1750" y="290" text-anchor="middle" class="tiny">1 × 6.3 mm jack</text>

  <!-- Pedal Loop A (left) -->
  <rect x="80" y="175" width="270" height="140" rx="12" class="loopA"/>
  <circle cx="150" cy="225" r="18" fill="#111827"/><circle cx="150" cy="225" r="7" fill="#fff"/>
  <circle cx="280" cy="225" r="18" fill="#111827"/><circle cx="280" cy="225" r="7" fill="#fff"/>
  <text x="150" y="255" text-anchor="middle" class="tiny">SEND</text>
  <text x="280" y="255" text-anchor="middle" class="tiny">RETURN</text>
  <text x="215" y="295" text-anchor="middle" class="label" fill="#ea580c">PEDAL LOOP A</text>
  <text x="215" y="312" text-anchor="middle" class="tiny">Color: ORANGE</text>

  <!-- Pedal Loop B (left) -->
  <rect x="80" y="335" width="270", height="140" rx="12" class="loopB"/>
  <circle cx="150" cy="385" r="18" fill="#111827"/><circle cx="150" cy="385" r="7" fill="#fff"/>
  <circle cx="280" cy="385" r="18" fill="#111827"/><circle cx="280" cy="385" r="7" fill="#fff"/>
  <text x="150" y="415" text-anchor="middle" class="tiny">SEND</text>
  <text x="280" y="415" text-anchor="middle" class="tiny">RETURN</text>
  <text x="215" y="455" text-anchor="middle" class="label" fill="#7c3aed">PEDAL LOOP B</text>
  <text x="215" y="472" text-anchor="middle" class="tiny">Color: PURPLE</text>

  <!-- top FX banks -->
  <text x="760" y="165" text-anchor="middle" class="label">FX SEND BANK — TO AMP FX RETURN</text>
  <text x="1320" y="165" text-anchor="middle" class="label">FX RETURN BANK — FROM AMP FX SEND</text>
  <rect x="500" y="180" width="500" height="130" rx="12" class="section"/>
  <rect x="1060" y="180" width="500" height="130" rx="12" class="section"/>
  <g>
    <circle cx="575" cy="225" r="18" fill="#111827"/><circle cx="575" cy="225" r="7" fill="#fff"/>
    <circle cx="700" cy="225" r="18" fill="#111827"/><circle cx="700" cy="225" r="7" fill="#fff"/>
    <circle cx="825" cy="225" r="18" fill="#111827"/><circle cx="825" cy="225" r="7" fill="#fff"/>
    <circle cx="950" cy="225" r="18" fill="#111827"/><circle cx="950" cy="225" r="7" fill="#fff"/>
    <text x="575" y="265" text-anchor="middle" class="label">S1</text><text x="700" y="265" text-anchor="middle" class="label">S2</text><text x="825" y="265" text-anchor="middle" class="label">S3</text><text x="950" y="265" text-anchor="middle" class="label">S4</text>
    <circle cx="575" cy="196" r="9" class="ledOff"/><circle cx="700" cy="196" r="9" class="ledOff"/><circle cx="825" cy="196" r="9" class="ledOn"/><circle cx="950" cy="196" r="9" class="ledOff"/>
  </g>
  <g>
    <circle cx="1135" cy="225" r="18" fill="#111827"/><circle cx="1135" cy="225" r="7" fill="#fff"/>
    <circle cx="1260" cy="225" r="18" fill="#111827"/><circle cx="1260" cy="225" r="7" fill="#fff"/>
    <circle cx="1385" cy="225" r="18" fill="#111827"/><circle cx="1385" cy="225" r="7" fill="#fff"/>
    <circle cx="1510" cy="225" r="18" fill="#111827"/><circle cx="1510" cy="225" r="7" fill="#fff"/>
    <text x="1135" y="265" text-anchor="middle" class="label">R1</text><text x="1260" y="265" text-anchor="middle" class="label">R2</text><text x="1385" y="265" text-anchor="middle" class="label">R3</text><text x="1510" y="265" text-anchor="middle" class="label">R4</text>
    <circle cx="1135" cy="196" r="9" class="ledOff"/><circle cx="1260" cy="196" r="9" class="ledOff"/><circle cx="1385" cy="196" r="9" class="ledOn"/><circle cx="1510" cy="196" r="9" class="ledOff"/>
  </g>

  <!-- bottom outputs -->
  <text x="1040" y="365" text-anchor="middle" class="label">AMP / DEVICE OUTPUT BANK</text>
  <rect x="500" y="380" width="1060" height="125" rx="12" class="section"/>
  <g>
    <circle cx="620" cy="425" r="20" fill="#111827"/><circle cx="620" cy="425" r="8" fill="#fff"/>
    <circle cx="850" cy="425" r="20" fill="#111827"/><circle cx="850" cy="425" r="8" fill="#fff"/>
    <circle cx="1080" cy="425" r="20" fill="#111827"/><circle cx="1080" cy="425" r="8" fill="#fff"/>
    <circle cx="1310" cy="425" r="20" fill="#111827"/><circle cx="1310" cy="425" r="8" fill="#fff"/>
    <text x="620" y="470" text-anchor="middle" class="label">OUT 1</text><text x="850" y="470" text-anchor="middle" class="label">OUT 2</text><text x="1080" y="470" text-anchor="middle" class="label">OUT 3</text><text x="1310" y="470" text-anchor="middle" class="label">OUT 4</text>
    <circle cx="620" cy="396" r="10" class="ledOff"/><circle cx="850" cy="396" r="10" class="ledOff"/><circle cx="1080" cy="396" r="10" class="ledOn"/><circle cx="1310" cy="396" r="10" class="ledOff"/>
  </g>
  <text x="1650" y="435" class="tiny">Total 17 jacks: 1 IN + 4 OUT +</text>
  <text x="1650" y="455" class="tiny">4 FX SEND + 4 FX RETURN + 4 loop jacks</text>
  <text x="1650" y="475" class="tiny">Total 12 channel LEDs (OUT/S/R)</text>
  <text x="1650" y="495" class="tiny">+ 2 multicolor arrow LEDs</text>

  <!-- routing core -->
  <rect x="250" y="590" width="1400" height="280" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="950" y="622" text-anchor="middle" class="label">AUDIO ROUTING CORE</text>

  <rect x="1610" y="650" width="210" height="75" rx="10" class="jack"/>
  <text x="1715" y="682" text-anchor="middle" class="label">CHANNEL SELECT</text>
  <text x="1715" y="705" text-anchor="middle" class="small">picks OUT/S/R pair 1–4</text>

  <rect x="1280" y="650" width="250" height="75" rx="10" class="jack"/>
  <text x="1405" y="682" text-anchor="middle" class="label">PRE-OUT ARROW BLOCK</text>
  <text x="1405" y="705" text-anchor="middle" class="small">before selected OUT</text>

  <rect x="960" y="650" width="250" height="75" rx="10" class="jack"/>
  <text x="1085" y="682" text-anchor="middle" class="label">FX-LOOP ARROW BLOCK</text>
  <text x="1085" y="705" text-anchor="middle" class="small">inside selected FX loop</text>

  <rect x="640" y="650" width="250" height="75" rx="10" class="jack"/>
  <text x="765" y="682" text-anchor="middle" class="label">LOOP A / LOOP B</text>
  <text x="765" y="705" text-anchor="middle" class="small">audio taps for both blocks</text>

  <path d="M300 240 C300 400 300 687 300 687 L640 687" class="signal"/>
  <path d="M890 687 L960 687" class="signal"/>
  <path d="M1210 687 L1280 687" class="signal"/>
  <path d="M1530 687 L1610 687" class="signal"/>
  <path d="M1820 687 C1850 687 1850 425 1310 425" class="signal"/>
  <path d="M1085 725 C1085 780 665 780 665 315" class="signal"/>
  <path d="M1085 725 C1085 780 1320 780 1320 315" class="signal"/>

  <text x="330" y="600" class="small">instrument audio</text>
  <text x="1330" y="600" class="small">to selected OUT</text>

  <!-- three footswitches -->
  <rect x="1580" y="960" width="260" height="100" rx="12" class="switchBox"/>
  <text x="1710" y="1000" text-anchor="middle" class="label">CENTER FOOTSWITCH</text>
  <text x="1710" y="1025" text-anchor="middle" class="small">cycles channel 1→2→3→4</text>
  <path d="M1710 960 L1710 725" class="logic"/>

  <rect x="1250" y="960" width="260" height="100" rx="12" class="switchBox"/>
  <text x="1380" y="1000" text-anchor="middle" class="label">RIGHT FOOTSWITCH</text>
  <text x="1380" y="1025" text-anchor="middle" class="small">cycles PRE-OUT arrow state</text>
  <path d="M1380 960 L1380 725" class="logic"/>

  <rect x="600" y="960" width="260" height="100" rx="12" class="switchBox"/>
  <text x="730" y="1000" text-anchor="middle" class="label">LEFT FOOTSWITCH</text>
  <text x="730" y="1025" text-anchor="middle" class="small">cycles FX-LOOP arrow state</text>
  <path d="M730 960 L1085 725" class="logic"/>

  <!-- arrow indicators with 4 state legend -->
  <text x="1085" y="1120" text-anchor="middle" class="label">FX-LOOP ARROW (4 states)</text>
  <polygon points="985,1145 1025,1122 1025,1138 1060,1138 1060,1153 1025,1153 1025,1168" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
  <text x="1005" y="1195" text-anchor="middle" class="tiny">OFF: none</text>
  <polygon points="1080,1145 1120,1122 1120,1138 1155,1138 1155,1153 1120,1153 1120,1168" fill="#ea580c" stroke="#7c2d12" stroke-width="2"/>
  <text x="1100" y="1195" text-anchor="middle" class="tiny">Loop A only</text>
  <polygon points="1180,1145 1220,1122 1220,1138 1255,1138 1255,1153 1220,1153 1220,1168" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <text x="1200" y="1195" text-anchor="middle" class="tiny">Loop B only</text>
  <polygon points="1280,1145 1320,1122 1320,1138 1355,1138 1355,1153 1320,1153 1320,1168" fill="url(#dual)" stroke="#111827" stroke-width="2"/>
  <text x="1300" y="1195" text-anchor="middle" class="tiny">A then B (series)</text>

  <text x="730" y="1120" text-anchor="middle" class="label">PRE-OUT ARROW (4 states)</text>
  <polygon points="630,1145 670,1122 670,1138 705,1138 705,1153 670,1153 670,1168" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
  <text x="650" y="1195" text-anchor="middle" class="tiny">OFF: none</text>
  <polygon points="725,1145 765,1122 765,1138 800,1138 800,1153 765,1153 765,1168" fill="#ea580c" stroke="#7c2d12" stroke-width="2"/>
  <text x="745" y="1195" text-anchor="middle" class="tiny">Loop A only</text>
  <polygon points="825,1145 865,1122 865,1138 900,1138 900,1153 865,1153 865,1168" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <text x="845" y="1195" text-anchor="middle" class="tiny">Loop B only</text>
  <polygon points="925,1145 965,1122 965,1138 1000,1138 1000,1153 965,1153 965,1168" fill="url(#dual)" stroke="#111827" stroke-width="2"/>
  <text x="945" y="1195" text-anchor="middle" class="tiny">A then B (series)</text>

  <linearGradient id="dual" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ea580c"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>

  <!-- ground -->
  <path d="M100 1230 L1800 1230" class="ground"/>
  <text x="100" y="1258" class="label">AUDIO_GND</text>
  <text x="260" y="1258" class="small">All 17 jack sleeves share the audio ground; signal tips remain separate.</text>

  <text x="950" y="1290" text-anchor="middle" class="tiny">Example shown: Channel 3 selected. FX-loop arrow = Loop A then Loop B (series). Pre-out arrow = OFF.</text>
</svg>
